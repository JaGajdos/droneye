<!-- Cookie Consent Banner -->
<div id="cookie-banner" class="cookie-banner" style="display: none">
    <div class="cookie-banner-content">
        <div class="cookie-banner-text">
            <h4 data-i18n="cookies.title">Používame cookies</h4>
            <p data-i18n="cookies.description">
                Táto stránka používa cookies na zlepšenie vášho zážitku. Pokračovaním v prehliadaní súhlasíte s
                používaním cookies v súlade s našou <a href="/gdpr">politikou cookies</a>.
            </p>
        </div>
        <div class="cookie-banner-buttons">
            <button id="cookie-accept" class="cookie-btn cookie-btn-accept" data-i18n="cookies.accept">Prijať všetky</button>
            <button id="cookie-reject" class="cookie-btn cookie-btn-reject" data-i18n="cookies.reject">Odmietnuť</button>
            <button id="cookie-settings" class="cookie-btn cookie-btn-settings" data-i18n="cookies.settings">Nastavenia</button>
        </div>
    </div>
</div>
