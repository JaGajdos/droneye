            * {

                margin: 0;
                box-sizing: border-box;
                -webkit-user-select: none;
                -moz-user-select: none;
                -ms-user-select: none;
                user-select: none;
            }

            #canvas-wrapper {

                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                z-index: -2;
            }
            #webgl {
                position: absolute;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                z-index: -2;
                display: block;
                touch-action: pan-y !important;
                user-select: none;
                -webkit-user-select: none;
                -webkit-touch-callout: none;
                -webkit-user-drag: none;
                -webkit-user-modify: none;
            }
            html {
                height: -webkit-fill-available;
            }
            body {
                padding: 0;
                margin: 0;
                overflow-x: hidden;
                scrollbar-width: thin;
                background-color: black;
                color: white;
                font-family: "Poppins", sans-serif;
                min-height: 100vh;
                min-height: -webkit-fill-available;
            }
            .section {
                text-align: center;
                padding: 40px;
                max-width: 800px;
            }
            .sub-section {
                height: 90vh;
            }
            main {
                display: flex;
                flex-direction: column;
                align-items: center;
                text-shadow: 1px 1px 2px #00000080;
            }
