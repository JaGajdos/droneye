<!doctype html>
<html lang="sk" data-theme="light">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title data-i18n-title="pageTitle.home">DroneEye - Moderné drone služby a 3D mapovanie</title>
        <meta
            name="description"
            content="Profesionálne drone služby, letecké snímkovanie, 3D mapovanie a analýza dát. Moderné riešenia pre vaše potreby."
        />
        <meta
            name="keywords"
            content="drone služby, letecké snímkovanie, 3D mapovanie, analýza dát, Bratislava, Slovensko"
        />
        <meta name="author" content="DroneEye" />
        <meta name="robots" content="index, follow" />
        <meta name="language" content="sk" />
        <meta name="revisit-after" content="7 days" />

        <!-- Favicon -->
        <link rel="icon" type="image/x-icon" href="/favicon.ico" />
        <link rel="icon" type="image/png" href="/favicon.png" />
        <link rel="apple-touch-icon" href="/favicon.png" />

        <!-- Canonical URL -->
        <link rel="canonical" href="https://www.droneye.sk/" />

        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://www.droneye.sk/" />
        <meta property="og:title" content="DroneEye - Moderné drone služby a 3D mapovanie" />
        <meta
            property="og:description"
            content="Profesionálne drone služby, letecké snímkovanie, 3D mapovanie a analýza dát. Moderné riešenia pre vaše potreby."
        />
        <meta property="og:image" content="https://www.droneye.sk/assets/og-image.jpg" />
        <meta property="og:site_name" content="DroneEye" />
        <meta property="og:locale" content="sk_SK" />

        <!-- Twitter -->
        <meta property="twitter:card" content="summary_large_image" />
        <meta property="twitter:url" content="https://www.droneye.sk/" />
        <meta property="twitter:title" content="DroneEye - Moderné drone služby a 3D mapovanie" />
        <meta
            property="twitter:description"
            content="Profesionálne drone služby, letecké snímkovanie, 3D mapovanie a analýza dát. Moderné riešenia pre vaše potreby."
        />
        <meta property="twitter:image" content="https://www.droneye.sk/assets/twitter-image.jpg" />

        <!-- Hreflang Tags -->
        <link rel="alternate" hreflang="sk" href="https://www.droneye.sk/" />
        <link rel="alternate" hreflang="en" href="https://www.droneye.sk/?lang=en" />
        <link rel="alternate" hreflang="de" href="https://www.droneye.sk/?lang=de" />
        <link rel="alternate" hreflang="x-default" href="https://www.droneye.sk/" />

        <!-- Structured Data - Organization -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "Organization",
                "name": "DroneEye",
                "url": "https://www.droneye.sk",
                "logo": "https://www.droneye.sk/assets/Logo.webp",
                "contactPoint": {
                    "@type": "ContactPoint",
                    "telephone": "+421950614303",
                    "contactType": "customer service",
                    "email": "info@droneye.sk",
                    "availableLanguage": ["sk", "en", "de"]
                },
                "sameAs": [
                    "https://www.instagram.com/dron_eyesky",
                    "https://www.facebook.com/profile.php?id=100066345406669",
                    "https://www.youtube.com/@dron_eyesky"
                ]
            }
        </script>

        <!-- Font Awesome -->
        <link rel="stylesheet" href="/assets/fontawesome/css/all.min.css" />

        <link rel="stylesheet" href="/src/style.css" />
        <style>
            @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap");
            * {
                padding: 0;
                margin: 0;
                box-sizing: border-box;
                -webkit-user-select: none;
                -moz-user-select: none;
                -ms-user-select: none;
                user-select: none;
            }
            input,
            textarea {
                -webkit-user-select: text;
                -moz-user-select: text;
                -ms-user-select: text;
                user-select: text;
            }
            #canvas-wrapper {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                z-index: -2;
            }
            #webgl {
                position: absolute;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                z-index: -2;
                display: block;
                touch-action: pan-y !important;
                user-select: none;
                -webkit-user-select: none;
                -webkit-touch-callout: none;
                -webkit-user-drag: none;
                -webkit-user-modify: none;
            }
            html {
                height: -webkit-fill-available;
            }
            body {
                padding: 0;
                margin: 0;
                overflow-x: hidden;
                scrollbar-width: thin;
                background-color: black;
                color: white;
                font-family: "Poppins", sans-serif;
                min-height: 100vh;
                min-height: -webkit-fill-available;
            }
            .section {
                text-align: center;
                padding: 40px;
                max-width: 800px;
            }

            main {
                display: flex;
                flex-direction: column;
                align-items: center;
                text-shadow: 1px 1px 2px #00000080;
            }
        </style>
        <script>
            // Hide content until translations are loaded to prevent flash of wrong language
            (function () {
                const savedLang = localStorage.getItem("language") || "sk";
                document.documentElement.setAttribute("lang", savedLang);
                document.documentElement.style.visibility = "hidden";
            })();
        </script>
    </head>
    <body class="homepage homepage-index3 homepage-landing-pending">
        <!-- Navigation -->
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-logo">
                    <a href="/" class="logo-link">
                        <img src="assets/logo.svg" alt="DroneEye Logo" class="logo-img" />
                    </a>
                </div>
                <ul class="nav-menu">
                    <li class="nav-item">
                        <a href="/" class="nav-link active" data-i18n="nav.home">Domov</a>
                    </li>
                    <li class="nav-item">
                        <a href="/sluzby" class="nav-link" data-i18n="nav.services">Naše služby</a>
                    </li>
                    <li class="nav-item">
                        <a href="/projekty" class="nav-link" data-i18n="nav.projects">Naše projekty</a>
                    </li>
                    <li class="nav-item">
                        <a href="/kurzy" class="nav-link" data-i18n="nav.team">Naše kurzy</a>
                    </li>
                    <li class="nav-item">
                        <a href="/cenova-ponuka" class="nav-link" data-i18n="nav.pricing">Cenová ponuka</a>
                    </li>
                    <li class="nav-item">
                        <a href="/kontakt" class="nav-link" data-i18n="nav.contact">Kontakt</a>
                    </li>
                    <li class="nav-item mobile-language-switcher">
                        <div class="mobile-language-buttons">
                            <button class="language-option active" data-lang="sk">SK</button>
                            <button class="language-option" data-lang="en">EN</button>
                            <button class="language-option" data-lang="de">DE</button>
                        </div>
                    </li>
                </ul>
                <div class="language-switcher">
                    <div class="language-buttons">
                        <button class="language-option active" data-lang="sk">SK</button>
                        <button class="language-option" data-lang="en">EN</button>
                        <button class="language-option" data-lang="de">DE</button>
                    </div>
                </div>
                <div class="hamburger">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </div>
                <button class="mobile-menu-close" aria-label="Close menu" style="display: none">
                    <i class="fas fa-times" aria-hidden="true"></i>
                </button>
            </div>
        </nav>

        <div id="canvas-wrapper">
            <canvas id="webgl" width="1357" height="868" style="width: 100%; height: 100%"></canvas>
        </div>
        <script src="droneye/three.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

        <!-- Hero → po „Preskúmať“ pokračuje intro príbeh na tej istej stránke -->
        <main class="main-content">
            <section class="hero" id="landing-hero">
                <h1 class="hero-title" data-i18n="hero.title">Vitajte v Droneye</h1>
                <p class="hero-subtitle" data-i18n="hero.subtitle">We see what you want to see</p>
                <div class="hero-buttons">
                    <button id="start-animation-btn" type="button" class="hero-button-primary" data-i18n="hero.cta">
                        Explore
                    </button>
                    <a href="/projekty" class="hero-button-secondary" data-i18n="nav.projects">Naše projekty</a>
                </div>
            </section>

            <div id="intro-scroll-hint" class="intro-scroll-hint" hidden aria-hidden="true" role="status">
                <span class="intro-scroll-hint__chevron" aria-hidden="true">
                    <i class="fas fa-chevron-down"></i>
                </span>
            </div>

            <div id="intro-scroll-stage" class="intro-scroll-stage" hidden>
                <div class="section" id="section1" style="text-align: center">
                    <div class="sub-section">
                        <h3 style="padding-top: 15vh">
                            <span class="intro-step-number" aria-hidden="true">1/4</span>
                            <span data-i18n="animation.text1.title"></span>
                        </h3>
                        <p data-i18n="animation.text1.subtitle"></p>
                    </div>
                    <div class="sub-section">
                        <h3 style="padding-top: 85vh">
                            <span class="intro-step-number" aria-hidden="true">2/4</span>
                            <span data-i18n="animation.text2.title"></span>
                        </h3>
                        <p data-i18n="animation.text2.subtitle"></p>
                    </div>
                    <div class="sub-section" style="padding-top: 10vh"></div>
                </div>
                <div class="section" id="section2">
                    <div class="sub-section">
                        <h3 style="padding-top: 60vh">
                            <span class="intro-step-number" aria-hidden="true">3/4</span>
                            <span data-i18n="animation.text3.title"></span>
                        </h3>
                        <p data-i18n="animation.text3.subtitle"></p>
                    </div>
                </div>
                <div class="section" id="section3">
                    <div class="sub-section">
                        <h3 style="padding-top: 80vh">
                            <span class="intro-step-number" aria-hidden="true">4/4</span
                            ><span data-i18n="animation.cta.title"></span>
                        </h3>
                        <p data-i18n="animation.cta.subtitle"></p>
                        <a href="/projekty" class="cta-button" data-i18n="animation.cta.button"></a>
                    </div>
                    <div class="sub-section" style="padding-top: 60vh"></div>
                </div>
            </div>
        </main>
        <script src="droneye/models/adapter-registry.js"></script>
        <script src="droneye/models/DroneModel.glb.js"></script>
        <script src="droneye/droneye-inline.js"></script>

        <!-- Loading Screen -->
        <div id="loading-screen">
            <div class="loader">
                <div class="loader-circle"></div>
                <p data-i18n="loading">Načítavam...</p>
            </div>
        </div>

        <!-- @include cookie-banner -->

        <script type="module" src="/src/main.js"></script>
        <script type="module" src="/src/cookies.js"></script>
    </body>
</html>
