<!DOCTYPE html>
<html lang="sk" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamiable Demo - DroneEye</title>
    <meta name="description" content="Three.js demo inspired by Gamiable">
    
    <!-- Font Awesome -->
    
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        input, textarea {
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }
        
        #canvas-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
        }
        
        #webgl {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            display: block;
            touch-action: pan-y !important;
            user-select: none;
            -webkit-user-select: none;
        }
        
        html {
            height: -webkit-fill-available;
        }
        
        body {
            padding: 0;
            margin: 0;
            overflow-x: hidden;
            background-color: black;
            color: white;
            font-family: 'Poppins', 'Montserrat', sans-serif;
            min-height: 100vh;
            min-height: -webkit-fill-available;
        }
        
        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 40px;
            max-width: 800px;
            margin: 0 auto;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }
        
        .section {
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
        
        h1 {
            font-size: 3rem;
            margin: 20px 0;
        }
        
        h2 {
            font-size: 2rem;
            margin: 20px 0;
        }
        
        p {
            font-size: 1.2rem;
            margin: 10px 0;
        }
        
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            color: white;
            font-size: 1.5rem;
        }
    </style>

</head>
<body>

        <canvas id="webgl"></canvas>

    <div class="loading" id="loading">Načítavam...</div>
    
    <main class="content">
        <div class="section" id="section1">
            <p style="padding-top: 20vh;">Welcome to</p>
            <h1>Gamiable Demo</h1>
        </div>
        
        <div class="section" id="section2">
            <h2 style="padding-top: 10vh;">We are passionate game developers</h2>
            <p>Creating unforgettable moments for players everywhere.</p>
        </div>
        
        <div class="section" id="section3">
            <h2 style="padding-top: 10vh;">We value creativity and innovation</h2>
            <p>Pushing boundaries and redefine what's possible.</p>
        </div>
    </main>
    
</body>
</html>
