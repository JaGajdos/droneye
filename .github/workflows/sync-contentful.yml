name: Sync Contentful

on:
    # Run on schedule (daily at 2 AM UTC)
    schedule:
        - cron: "0 2 * * *"
    # Allow manual trigger
    workflow_dispatch:
    # Run on push to main branch (optional - if you want to sync on every push)
    # push:
    #   branches:
    #     - main

jobs:
    sync:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  fetch-depth: 0

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.1"
                  extensions: curl, mbstring

            - name: Run Contentful synchronization
              run: php sync-contentful.php
              # Credentials are already in sync-contentful.php
              # To use GitHub Secrets instead, uncomment and set secrets:
              # env:
              #   CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
              #   CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}

            - name: Commit and push changes
              run: |
                  git config --local user.email "action@github.com"
                  git config --local user.name "GitHub Action"
                  git add assets/contentful/
                  if git diff --staged --quiet; then
                    echo "No changes to commit"
                  else
                    git commit -m "🔄 Auto-sync Contentful content [skip ci]"
                    git push origin HEAD:master
                  fi
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
