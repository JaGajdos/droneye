name: Sync Contentful

on:
    # Run on schedule (daily at 2 AM UTC)
    schedule:
        - cron: "0 2 * * *"
    # Allow manual trigger
    workflow_dispatch:
    # Run on push to main branch (optional - if you want to sync on every push)
    # push:
    #   branches:
    #     - main

jobs:
    sync:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout master branch
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  ref: master
                  fetch-depth: 0

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.1"
                  extensions: curl, mbstring

            - name: Run Contentful synchronization
              run: php sync-contentful.php
              # Credentials are already in sync-contentful.php
              # To use GitHub Secrets instead, uncomment and set secrets:
              # env:
              #   CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
              #   CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}

            - name: Commit changes to master
              run: |
                  git config --local user.email "action@github.com"
                  git config --local user.name "GitHub Action"
                  git add assets/contentful/
                  if git diff --staged --quiet; then
                    echo "No changes to commit on master"
                  else
                    git commit -m "🔄 Auto-sync Contentful content [skip ci]"
                    git push origin master
                  fi
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Checkout gh-pages branch
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  ref: gh-pages
                  fetch-depth: 0
                  path: gh-pages

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Build project
              run: npm run build

            - name: Checkout gh-pages branch
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  ref: gh-pages
                  fetch-depth: 0
                  path: gh-pages

            - name: Copy build and Contentful files to gh-pages
              run: |
                  # Copy build output
                  cp -r dist/* gh-pages/
                  # Ensure Contentful directory exists
                  mkdir -p gh-pages/assets/contentful/images
                  # Copy Contentful JSON files and images
                  cp -r assets/contentful/*.json gh-pages/assets/contentful/ 2>/dev/null || true
                  cp -r assets/contentful/images/* gh-pages/assets/contentful/images/ 2>/dev/null || true

            - name: Commit and push to gh-pages
              run: |
                  cd gh-pages
                  git config --local user.email "action@github.com"
                  git config --local user.name "GitHub Action"
                  git add .
                  if git diff --staged --quiet; then
                    echo "No changes to commit on gh-pages"
                  else
                    git commit -m "🔄 Auto-sync Contentful content and rebuild [skip ci]"
                    git push origin gh-pages
                  fi
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
