<!doctype html>
<html lang="sk" data-theme="light">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title data-i18n-title="pageTitle.projects">Naše projekty - DroneEye</title>
        <meta
            name="description"
            content="Pozrite si naše najnovšie úspešné projekty - letecké mapovanie, monitoring poľnohospodárskych plôch a inspekcia energetických vedení."
        />
        <meta
            name="keywords"
            content="drone projekty, letecké mapovanie, monitoring, inspekcia vedení, 3D mapovanie, Bratislava"
        />
        <meta name="author" content="DroneEye" />
        <meta name="robots" content="index, follow" />
        <meta name="language" content="sk" />
        <meta name="revisit-after" content="7 days" />

        <!-- Favicon -->
        <link rel="icon" type="image/x-icon" href="/favicon.ico" />
        <link rel="icon" type="image/png" href="/favicon.png" />
        <link rel="apple-touch-icon" href="/favicon.png" />

        <!-- Canonical URL -->
        <link rel="canonical" href="https://www.droneye.sk/projekty" />

        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://www.droneye.sk/projekty" />
        <meta property="og:title" content="Naše projekty - DroneEye" />
        <meta
            property="og:description"
            content="Pozrite si naše najnovšie úspešné projekty - letecké mapovanie, monitoring poľnohospodárskych plôch a inspekcia energetických vedení."
        />
        <meta property="og:image" content="https://www.droneye.sk/assets/projects-og.jpg" />
        <meta property="og:site_name" content="DroneEye" />
        <meta property="og:locale" content="sk_SK" />

        <!-- Twitter -->
        <meta property="twitter:card" content="summary_large_image" />
        <meta property="twitter:url" content="https://www.droneye.sk/projekty" />
        <meta property="twitter:title" content="Naše projekty - DroneEye" />
        <meta
            property="twitter:description"
            content="Pozrite si naše najnovšie úspešné projekty - letecké mapovanie, monitoring poľnohospodárskych plôch a inspekcia energetických vedení."
        />
        <meta property="twitter:image" content="https://www.droneye.sk/assets/projects-twitter.jpg" />

        <!-- Additional SEO -->
        <meta name="geo.region" content="SK" />
        <meta name="geo.placename" content="Bratislava" />
        <meta name="geo.position" content="48.1486;17.1077" />
        <meta name="ICBM" content="48.1486, 17.1077" />

        <!-- Hreflang Tags -->
        <link rel="alternate" hreflang="sk" href="https://www.droneye.sk/projekty" />
        <link rel="alternate" hreflang="en" href="https://www.droneye.sk/projekty?lang=en" />
        <link rel="alternate" hreflang="de" href="https://www.droneye.sk/projekty?lang=de" />
        <link rel="alternate" hreflang="x-default" href="https://www.droneye.sk/projekty" />

        <!-- Structured Data - CollectionPage -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "CollectionPage",
                "name": "Naše projekty",
                "description": "Pozrite si naše najnovšie úspešné projekty - letecké mapovanie, monitoring poľnohospodárskych plôch a inspekcia energetických vedení.",
                "url": "https://www.droneye.sk/projekty"
            }
        </script>

        <!-- Structured Data - BreadcrumbList -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "BreadcrumbList",
                "itemListElement": [
                    {
                        "@type": "ListItem",
                        "position": 1,
                        "name": "Domov",
                        "item": "https://www.droneye.sk/"
                    },
                    {
                        "@type": "ListItem",
                        "position": 2,
                        "name": "Naše projekty",
                        "item": "https://www.droneye.sk/projekty"
                    }
                ]
            }
        </script>

        <!-- Font Awesome -->
        <link rel="stylesheet" href="/assets/fontawesome/css/all.min.css" />

        <link rel="stylesheet" href="/src/style.css" />
        <script>
            // Hide content until translations are loaded to prevent flash of wrong language
            (function () {
                const savedLang = localStorage.getItem("language") || "sk";
                document.documentElement.setAttribute("lang", savedLang);
                document.documentElement.style.visibility = "hidden";
            })();
        </script>
    </head>
    <body>
        <!-- Navigation -->
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-logo">
                    <a href="/" class="logo-link">
                        <img src="assets/logo.svg" alt="DroneEye Logo" class="logo-img" />
                    </a>
                </div>
                <ul class="nav-menu">
                    <li class="nav-item">
                        <a href="/" class="nav-link" data-i18n="nav.home">Domov</a>
                    </li>
                    <li class="nav-item">
                        <a href="/sluzby" class="nav-link" data-i18n="nav.services">Naše služby</a>
                    </li>
                    <li class="nav-item">
                        <a href="/projekty" class="nav-link active" data-i18n="nav.projects">Naše projekty</a>
                    </li>
                    <li class="nav-item">
                        <a href="/kurzy" class="nav-link" data-i18n="nav.team">Naše kurzy</a>
                    </li>
                    <li class="nav-item">
                        <a href="/cenova-ponuka" class="nav-link" data-i18n="nav.pricing">Cenová ponuka</a>
                    </li>
                    <li class="nav-item">
                        <a href="/kontakt" class="nav-link" data-i18n="nav.contact">Kontakt</a>
                    </li>
                    <li class="nav-item mobile-language-switcher">
                        <div class="mobile-language-buttons">
                            <button class="language-option active" data-lang="sk">SK</button>
                            <button class="language-option" data-lang="en">EN</button>
                            <button class="language-option" data-lang="de">DE</button>
                        </div>
                    </li>
                </ul>
                <div class="language-switcher">
                    <div class="language-buttons">
                        <button class="language-option active" data-lang="sk">SK</button>
                        <button class="language-option" data-lang="en">EN</button>
                        <button class="language-option" data-lang="de">DE</button>
                    </div>
                </div>
                <div class="hamburger">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </div>
                <button class="mobile-menu-close" aria-label="Close menu" style="display: none">
                    <i class="fas fa-times" aria-hidden="true"></i>
                </button>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Projects Page -->
            <section class="page active">
                <!-- Subpage Hero -->
                <div class="subpage-hero">
                    <div class="subpage-hero-content">
                        <h1 data-i18n="projects.title">Naše projekty</h1>
                        <p data-i18n="projects.subtitle">Pozrite si naše najnovšie úspešné projekty</p>
                    </div>
                </div>

                <!-- Subpage Content -->
                <div class="subpage-content">
                    <!-- Videos Section -->
                    <div class="content-section">
                        <div class="container">
                            <p class="section-subtitle" data-i18n="projects.videos.subtitle">
                                Pozrite si naše najnovšie videá
                            </p>
                            <div class="videos-grid">
                                <!-- Videos will be loaded dynamically from Contentful JSON -->
                            </div>
                            <div class="videos-cta-wrapper">
                                <a href="kontakt.html" class="cta-button" data-i18n="projects.videos.cta"
                                    >Kontaktujte nás</a
                                >
                            </div>
                        </div>
                    </div>

                    <!-- Photos Section -->
                    <div class="content-section-bg-image" style="background-image: url(&quot;/assets/city1.webp&quot;)">
                        <div class="container">
                            <div class="section-on-image-panel">
                                <p class="section-subtitle" data-i18n="projects.photos.subtitle">
                                    Pozrite si naše najnovšie fotografie
                                </p>
                            </div>
                            <div class="photos-grid">
                                <!-- Photos will be loaded dynamically from Contentful JSON -->
                            </div>

                            <!-- Lightbox Modal -->
                            <div id="photo-lightbox" class="photo-lightbox">
                                <button class="photo-lightbox-close" aria-label="Close lightbox">&times;</button>
                                <button class="photo-lightbox-prev" aria-label="Previous photo">&#10094;</button>
                                <button class="photo-lightbox-next" aria-label="Next photo">&#10095;</button>
                                <div class="photo-lightbox-content">
                                    <img id="lightbox-image" src="" alt="Fotografia z galérie projektov DroneEye" />
                                    <div class="photo-lightbox-counter">
                                        <span id="lightbox-current">1</span> / <span id="lightbox-total">1</span>
                                    </div>
                                </div>
                            </div>
                            <div class="photos-cta-wrapper" style="display: none">
                                <a href="kontakt.html" class="cta-button" data-i18n="projects.photos.cta"
                                    >Kontaktujte nás</a
                                >
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- Loading Screen -->
        <div id="loading-screen">
            <div class="loader">
                <div class="loader-circle"></div>
                <p data-i18n="loading">Načítavam...</p>
            </div>
        </div>

        <!-- @include footer -->

        <!-- @include cookie-banner -->

        <script type="module" src="/src/main.js"></script>
        <script type="module" src="/src/cookies.js"></script>
    </body>
</html>
